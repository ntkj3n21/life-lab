services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lifelab}
      POSTGRES_USER: ${DB_USERNAME:-lifelab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lifelab}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - lifelab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  lifelab_postgres_data:
