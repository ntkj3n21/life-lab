spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: life-lab-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:lifelab}
    username: ${DB_USERNAME:lifelab}
    password: ${DB_PASSWORD:lifelab}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${LIFELAB_MULTIPART_MAX_FILE_SIZE:52MB}
      max-request-size: ${LIFELAB_MULTIPART_MAX_REQUEST_SIZE:54MB}

app:
  default-time-zone: ${LIFELAB_DEFAULT_TIME_ZONE:UTC}
  image-storage:
    location: ${LIFELAB_IMAGE_STORAGE_PATH:./data/images}
    max-upload-size: ${LIFELAB_IMAGE_MAX_UPLOAD_SIZE:10MB}
  audio-storage:
    location: ${LIFELAB_AUDIO_STORAGE_PATH:./data/audio}
    max-upload-size: ${LIFELAB_AUDIO_MAX_UPLOAD_SIZE:50MB}
  youtube:
    api-key: ${LIFELAB_YOUTUBE_API_KEY:}
  security:
    jwt:
      issuer: ${LIFELAB_JWT_ISSUER:life-lab}
      access-token-ttl: ${LIFELAB_JWT_ACCESS_TOKEN_TTL:30m}
      secret: ${LIFELAB_JWT_SECRET:}
    cookie:
      secure: ${LIFELAB_COOKIE_SECURE:false}
